name: Build Android APK

# Produces a debug-signed APK you can install on any Android phone directly.
# No developer account, no signing setup, no expiry.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    # Linux runner — far cheaper in Actions minutes than macOS.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app (Next.js static export -> ./out)
        run: npm run build

      - name: Sync Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
